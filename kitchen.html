<script>
    const LINE_WIDTH = 24;
    let autoPrintEnabled = false;

    // Load saved orders from localStorage or seed initial order #101
    let activeOrders = JSON.parse(localStorage.getItem("activeKitchenOrders") || "null");
    if (!activeOrders || activeOrders.length === 0) {
      activeOrders = [
        {
          id: "101",
          customer: "Justin",
          time: "11:40 AM",
          items: [
            { name: "Dan Dan Noodles", qty: 1, price: 8.50 },
            { name: "Chicken Chow Mein", qty: 1, price: 8.95 }
          ],
          total: 17.45
        }
      ];
      localStorage.setItem("activeKitchenOrders", JSON.stringify(activeOrders));
    }

    function formatRow(left, right) {
      const maxLeft = LINE_WIDTH - right.length - 1;
      let trimmedLeft = left;
      if (trimmedLeft.length > maxLeft) {
        trimmedLeft = trimmedLeft.substring(0, maxLeft);
      }
      const spaces = Math.max(1, LINE_WIDTH - (trimmedLeft.length + right.length));
      return trimmedLeft + " ".repeat(spaces) + right;
    }

    function centerRow(text) {
      if (text.length >= LINE_WIDTH) return text;
      const pad = Math.floor((LINE_WIDTH - text.length) / 2);
      return " ".repeat(pad) + text;
    }

    function sendToPrinter(order) {
      const sep = "=".repeat(LINE_WIDTH);
      const dash = "-".repeat(LINE_WIDTH);

      let ticket = [
        sep,
        centerRow("WOKS WAGON"),
        centerRow("GOTTAEAT ORDER"),
        sep,
        formatRow("#" + order.id, order.time),
        "Customer: " + order.customer.substring(0, 14),
        dash
      ];

      order.items.forEach(item => {
        const itemLine = `${item.qty}x ${item.name}`;
        ticket.push(formatRow(itemLine, item.price.toFixed(2)));
      });

      ticket.push(dash);
      ticket.push(formatRow("TOTAL:", "GBP " + order.total.toFixed(2)));
      ticket.push(sep);
      ticket.push("");
      ticket.push("");
      ticket.push("");

      const payload = ticket.join("\n");
      const base64Data = btoa(unescape(encodeURIComponent(payload)));
      window.location.href = "rawbt:data:text/plain;base64," + base64Data;
    }

    function completeOrder(orderId) {
      activeOrders = activeOrders.filter(order => order.id !== orderId);
      localStorage.setItem("activeKitchenOrders", JSON.stringify(activeOrders));
      renderOrders();
    }

    function renderOrders() {
      const container = document.getElementById("orders-container");
      container.innerHTML = "";

      if (activeOrders.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h2>No active orders</h2>
            <p style="margin-top: 8px;">Tap <strong>+ Test Order</strong> at the top or place an order from the customer menu.</p>
          </div>
        `;
        return;
      }

      activeOrders.forEach(order => {
        const card = document.createElement("div");
        card.className = "order-card";

        const itemsHtml = order.items.map(item => `
          <div class="item-row">
            <span class="item-name">${item.qty}x ${item.name}</span>
            <span class="item-price">${item.price.toFixed(2)}</span>
          </div>
        `).join("");

        card.innerHTML = `
          <div class="order-header">
            <div>
              <div class="order-number">Order #${order.id}</div>
              <div class="order-customer">Customer: ${order.customer}</div>
            </div>
            <div class="order-time">${order.time}</div>
          </div>
          <div class="item-list">
            ${itemsHtml}
          </div>
          <div class="order-footer">
            <span>Total:</span>
            <span>GBP ${order.total.toFixed(2)}</span>
          </div>
          <div class="card-actions">
            <button class="btn-print" onclick="sendToPrinter(activeOrders.find(o => o.id === '${order.id}'))">
              Print Ticket
            </button>
            <button class="btn-done" onclick="completeOrder('${order.id}')">
              Done
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function generateSimulatedOrder() {
      const mockNames = ["Sarah M.", "David K.", "Elena R.", "Marcus T."];
      const menu = [
        { name: "Sweet & Sour Pork", price: 9.20 },
        { name: "Egg Fried Rice", price: 4.50 },
        { name: "Spring Rolls (4)", price: 4.80 },
        { name: "Beef Chow Mein", price: 9.50 }
      ];

      const randomId = Math.floor(102 + Math.random() * 800).toString();
      const randomCustomer = mockNames[Math.floor(Math.random() * mockNames.length)];
      const randomItem1 = menu[Math.floor(Math.random() * menu.length)];
      const randomItem2 = menu[Math.floor(Math.random() * menu.length)];

      const now = new Date();
      const hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const timeStr = `${hours % 12 || 12}:${minutes} ${hours >= 12 ? 'PM' : 'AM'}`;

      const newOrder = {
        id: randomId,
        customer: randomCustomer,
        time: timeStr,
        items: [
          { name: randomItem1.name, qty: 1, price: randomItem1.price },
          { name: randomItem2.name, qty: 1, price: randomItem2.price }
        ],
        total: Number((randomItem1.price + randomItem2.price).toFixed(2))
      };

      activeOrders.unshift(newOrder);
      localStorage.setItem("activeKitchenOrders", JSON.stringify(activeOrders));
      renderOrders();

      if (autoPrintEnabled) {
        sendToPrinter(newOrder);
      }
    }

    function toggleAutoPrint() {
      autoPrintEnabled = !autoPrintEnabled;
      const btn = document.getElementById("toggle-autoprint");
      btn.textContent = "Auto-Print: " + (autoPrintEnabled ? "ON" : "OFF");
      btn.classList.toggle("active", autoPrintEnabled);
    }

    // Real-time listener: detects orders placed in another tab on gottaeat.co.uk
    window.addEventListener("storage", (e) => {
      if (e.key === "activeKitchenOrders" && e.newValue) {
        activeOrders = JSON.parse(e.newValue);
        renderOrders();
        if (autoPrintEnabled && activeOrders.length > 0) {
          sendToPrinter(activeOrders[0]);
        }
      }
    });

    renderOrders();
</script>
