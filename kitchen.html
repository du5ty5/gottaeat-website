<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitchen Live Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #121820;
      color: #ffffff;
      padding: 16px;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    h1 {
      color: #ff7a00;
      font-size: 24px;
    }
    .btn-bar {
      display: flex;
      gap: 8px;
    }
    .btn-top {
      background: #2a3547;
      color: #fff;
      border: 1px solid #3e4c63;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }
    .orders-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 16px;
    }
    .card {
      background: #1e2634;
      border: 2px solid #334155;
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card.pending {
      border-color: #ef4444;
      background: #231924;
      animation: alertPulse 1.2s infinite ease-in-out;
    }
    @keyframes alertPulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .card.accepted {
      border-left: 6px solid #22c55e;
    }
    .badge {
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .badge-del { background: #0284c7; }
    .badge-col { background: #d97706; }
    .badge-pen { background: #dc2626; }
    .badge-cook { background: #16a34a; }
    .addr-box {
      background: #0f172a;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.3;
    }
    .prep-box {
      background: #064e3b;
      color: #6ee7b7;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 700;
      width: fit-content;
    }
    .items-box {
      background: #161f2e;
      padding: 8px 12px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px;
    }
    .item-line {
      display: flex;
      justify-content: space-between;
    }
    .time-selector {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 4px;
    }
    .time-selector label {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
    }
    .time-btn {
      background: #2a3547;
      border: 1px solid #475569;
      color: #ffffff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .time-btn.selected {
      background: #e11d48;
      border-color: #f43f5e;
    }
    .action-row {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }
    .btn-acc {
      flex: 2;
      background: #16a34a;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-rej {
      flex: 1;
      background: #dc2626;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-prt {
      flex: 2;
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-don {
      flex: 1;
      background: #475569;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body onclick="enableAudio()">

  <div class="header-bar">
    <div>
      <h1>Kitchen Orders</h1>
      <small id="audio-tag" style="color: #94a3b8;">Tap screen once to enable sound alert</small>
    </div>
    <div class="btn-bar">
      <button class="btn-top" onclick="addMockOrder('DELIVERY')">+ Test Delivery</button>
      <button class="btn-top" onclick="addMockOrder('COLLECTION')">+ Test Collection</button>
      <button class="btn-top" style="background:#b91c1c;" onclick="clearAll()">Clear Screen</button>
    </div>
  </div>

  <div class="orders-grid" id="grid"></div>

  <script>
    const LINE_WIDTH = 24;
    let audioReady = false;
    let alarmInterval = null;
    const selectedPrepTimes = {};

    function enableAudio() {
      audioReady = true;
      const tag = document.getElementById("audio-tag");
      if (tag) {
        tag.textContent = "Sound Alert Active";
        tag.style.color = "#4ade80";
      }
    }

    function beep() {
      if (!audioReady) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 880;
        gain.gain.value = 0.2;
        osc.start();
        setTimeout(() => { osc.stop(); ctx.close(); }, 300);
      } catch (e) {}
    }

    const defaultOrders = [
      {
        id: "101",
        status: "ACCEPTED",
        type: "DELIVERY",
        customer: "Justin",
        phone: "07123 456789",
        address: "12 High Street, PO11 0AA",
        notes: "Ring doorbell",
        time: "11:40 AM",
        prepTime: "30 mins",
        items: [
          { name: "Dan Dan Noodles", qty: 1, price: 8.50 },
          { name: "Chicken Chow Mein", qty: 1, price: 8.95 }
        ],
        total: 17.45
      }
    ];

    let orders = [];

    function loadOrders() {
      try {
        const stored = localStorage.getItem("activeKitchenOrders");
        if (stored) {
          const parsed = JSON.parse(stored);
          if (Array.isArray(parsed) && parsed.length > 0) {
            orders = parsed;
            return;
          }
        }
      } catch (e) {}
      orders = [...defaultOrders];
      saveOrders();
    }

    function saveOrders() {
      try {
        localStorage.setItem("activeKitchenOrders", JSON.stringify(orders));
      } catch (e) {}
    }

    function checkAlarms() {
      const hasPending = orders.some(o => o.status === "PENDING");
      if (hasPending) {
        if (!alarmInterval) {
          beep();
          alarmInterval = setInterval(beep, 1500);
        }
      } else {
        if (alarmInterval) {
          clearInterval(alarmInterval);
          alarmInterval = null;
        }
      }
    }

    function formatRow(left, right) {
      const maxLeft = LINE_WIDTH - right.length - 1;
      let trimmedLeft = left;
      if (trimmedLeft.length > maxLeft) trimmedLeft = trimmedLeft.substring(0, maxLeft);
      const spaces = Math.max(1, LINE_WIDTH - (trimmedLeft.length + right.length));
      return trimmedLeft + " ".repeat(spaces) + right;
    }

    function centerRow(text) {
      if (text.length >= LINE_WIDTH) return text;
      const pad = Math.floor((LINE_WIDTH - text.length) / 2);
      return " ".repeat(pad) + text;
    }

    function printSlip(order) {
      const sep = "=".repeat(LINE_WIDTH);
      const dash = "-".repeat(LINE_WIDTH);

      let ticket = [
        sep,
        centerRow("WOKS WAGON"),
        centerRow("*** " + order.type + " ***"),
        sep,
        formatRow("#" + order.id, order.time),
        "Cust: " + order.customer.substring(0, 16)
      ];

      if (order.phone) ticket.push("Tel:  " + order.phone.substring(0, 16));
      if (order.prepTime) ticket.push(formatRow("PREP:", order.prepTime));

      if (order.type === "DELIVERY" && order.address) {
        ticket.push(dash);
        ticket.push("DELIVER TO:");
        ticket.push(order.address.substring(0, LINE_WIDTH));
        if (order.address.length > LINE_WIDTH) {
          ticket.push(order.address.substring(LINE_WIDTH, LINE_WIDTH * 2));
        }
      }

      if (order.notes) {
        ticket.push(dash);
        ticket.push("NOTE: " + order.notes.substring(0, 18));
      }

      ticket.push(dash);

      order.items.forEach(i => {
        ticket.push(formatRow(i.qty + "x " + i.name, Number(i.price).toFixed(2)));
      });

      ticket.push(dash);
      ticket.push(formatRow("TOTAL:", "GBP " + Number(order.total).toFixed(2)));
      ticket.push(sep);
      ticket.push(centerRow("Thank you for ordering!"));
      ticket.push(centerRow("02392 460505"));
      ticket.push("");
      ticket.push("");
      ticket.push("");

      const payload = ticket.join("\n");
      const base64Data = btoa(unescape(encodeURIComponent(payload)));
      window.location.href = "rawbt:data:text/plain;base64," + base64Data;
    }

    function setPrepTime(id, mins) {
      selectedPrepTimes[id] = mins + " mins";
      draw();
    }

    function accept(id) {
      const o = orders.find(x => x.id === id);
      if (o) {
        o.status = "ACCEPTED";
        o.prepTime = selectedPrepTimes[id] || (o.type === "DELIVERY" ? "45 mins" : "20 mins");
        saveOrders();
        draw();
        checkAlarms();
        printSlip(o);
      }
    }

    function reject(id) {
      const reasons = ["Kitchen at capacity", "Out of delivery area", "Store closing soon", "Item sold out"];
      const chosen = prompt("Select or enter rejection reason:\n1. Kitchen at capacity\n2. Out of delivery area\n3. Store closing soon\n4. Item sold out", "Kitchen at capacity");
      if (chosen === null) return;

      orders = orders.filter(x => x.id !== id);
      saveOrders();
      draw();
      checkAlarms();
    }

    function complete(id) {
      orders = orders.filter(x => x.id !== id);
      saveOrders();
      draw();
      checkAlarms();
    }

    function clearAll() {
      orders = [];
      saveOrders();
      draw();
      checkAlarms();
    }

    function draw() {
      const g = document.getElementById("grid");
      if (!g) return;
      g.innerHTML = "";

      if (orders.length === 0) {
        g.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:40px; color:#64748b;">No active orders on screen.</div>`;
        return;
      }

      orders.forEach(o => {
        const isPen = o.status === "PENDING";
        const isDel = o.type === "DELIVERY";
        const currentPrep = selectedPrepTimes[o.id] || (isDel ? "45 mins" : "20 mins");

        const div = document.createElement("div");
        div.className = "card " + (isPen ? "pending" : "accepted");

        const itemsHtml = o.items.map(i => `
          <div class="item-line">
            <span>${i.qty}x ${i.name}</span>
            <span>£${Number(i.price * i.qty).toFixed(2)}</span>
          </div>
        `).join("");

        const prepSelectorHtml = isPen ? `
          <div class="time-selector">
            <label>Est:</label>
            <button class="time-btn ${currentPrep === '20 mins' ? 'selected' : ''}" onclick="setPrepTime('${o.id}', 20)">20m</button>
            <button class="time-btn ${currentPrep === '30 mins' ? 'selected' : ''}" onclick="setPrepTime('${o.id}', 30)">30m</button>
            <button class="time-btn ${currentPrep === '45 mins' ? 'selected' : ''}" onclick="setPrepTime('${o.id}', 45)">45m</button>
            <button class="time-btn ${currentPrep === '60 mins' ? 'selected' : ''}" onclick="setPrepTime('${o.id}', 60)">60m</button>
          </div>
        ` : `<div class="prep-box">⏱ Ready in: ${o.prepTime || currentPrep}</div>`;

        div.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
              <strong style="font-size:18px;">#${o.id}</strong>
              <span class="badge ${isDel ? 'badge-del' : 'badge-col'}">${o.type}</span>
              <span class="badge ${isPen ? 'badge-pen' : 'badge-cook'}">${isPen ? 'Pending' : 'Cooking'}</span>
            </div>
            <span style="font-size:12px; color:#94a3b8;">${o.time}</span>
          </div>

          <div style="font-size:14px;"><strong>${o.customer}</strong> ${o.phone ? '• ' + o.phone : ''}</div>

          ${isDel ? `<div class="addr-box">📍 <strong>Delivery Address:</strong><br>${o.address}</div>` : `<div class="addr-box" style="border-left:3px solid #d97706;">📦 Collection at Counter</div>`}

          ${o.notes ? `<div style="font-size:12px; color:#fbbf24;">📝 Note: ${o.notes}</div>` : ''}

          ${prepSelectorHtml}

          <div class="items-box">${itemsHtml}</div>

          <div style="display:flex; justify-content:space-between; font-weight:800; font-size:16px;">
            <span>Total:</span>
            <span style="color:#4ade80;">£${Number(o.total).toFixed(2)}</span>
          </div>

          <div class="action-row">
            ${isPen ? `
              <button class="btn-acc" onclick="accept('${o.id}')">✓ Accept (${currentPrep})</button>
              <button class="btn-rej" onclick="reject('${o.id}')">✕ Reject</button>
            ` : `
              <button class="btn-prt" onclick="printSlip(orders.find(x => x.id === '${o.id}'))">🖨 Reprint</button>
              <button class="btn-don" onclick="complete('${o.id}')">Done</button>
            `}
          </div>
        `;
        g.appendChild(div);
      });
    }

    function addMockOrder(type) {
      enableAudio();
      const id = Math.floor(102 + Math.random() * 800).toString();
      const now = new Date();
      const timeStr = `${now.getHours() % 12 || 12}:${String(now.getMinutes()).padStart(2, '0')} ${now.getHours() >= 12 ? 'PM' : 'AM'}`;

      const newOrder = {
        id: id,
        status: "PENDING",
        type: type,
        customer: type === "DELIVERY" ? "Sarah Jenkins" : "David Miller",
        phone: "07987 654321",
        address: type === "DELIVERY" ? "48 Seafront Road, Hayling Island, PO11 9HL" : "STORE PICKUP",
        notes: type === "DELIVERY" ? "Leave on porch" : "",
        time: timeStr,
        items: [
          { name: "Sweet & Sour Pork", qty: 1, price: 9.20 },
          { name: "Egg Fried Rice", qty: 1, price: 4.50 }
        ],
        total: type === "DELIVERY" ? 16.19 : 14.69
      };

      orders.unshift(newOrder);
      saveOrders();
      draw();
      checkAlarms();
    }

    window.addEventListener("storage", (e) => {
      if (e.key === "activeKitchenOrders" && e.newValue) {
        try {
          orders = JSON.parse(e.newValue);
          draw();
          checkAlarms();
        } catch (err) {}
      }
    });

    loadOrders();
    draw();
    checkAlarms();
  </script>
</body>
</html>
