<script>
    const LINE_WIDTH = 24;
    let audioReady = false;
    let alarmInterval = null;

    function enableAudio() {
      audioReady = true;
      const tag = document.getElementById("audio-tag");
      if (tag) {
        tag.textContent = "Sound Alert Active";
        tag.style.color = "#4ade80";
      }
    }

    function beep() {
      if (!audioReady) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 880;
        gain.gain.value = 0.2;
        osc.start();
        setTimeout(() => { osc.stop(); ctx.close(); }, 300);
      } catch (e) {}
    }

    const defaultOrders = [
      {
        id: "101",
        status: "ACCEPTED",
        type: "DELIVERY",
        customer: "Justin",
        phone: "07123 456789",
        address: "12 High Street, PO11 0AA",
        notes: "Ring doorbell",
        time: "11:40 AM",
        items: [
          { name: "Dan Dan Noodles", qty: 1, price: 8.50 },
          { name: "Chicken Chow Mein", qty: 1, price: 8.95 }
        ],
        total: 17.45
      }
    ];

    let orders = [];

    // Safely syncs with browser localStorage
    function loadOrders() {
      try {
        const stored = localStorage.getItem("activeKitchenOrders");
        if (stored) {
          const parsed = JSON.parse(stored);
          if (Array.isArray(parsed) && parsed.length > 0) {
            orders = parsed;
            return;
          }
        }
      } catch (e) {}
      orders = [...defaultOrders];
      saveOrders();
    }

    function saveOrders() {
      try {
        localStorage.setItem("activeKitchenOrders", JSON.stringify(orders));
      } catch (e) {}
    }

    function checkAlarms() {
      const hasPending = orders.some(o => o.status === "PENDING");
      if (hasPending) {
        if (!alarmInterval) {
          beep();
          alarmInterval = setInterval(beep, 1500);
        }
      } else {
        if (alarmInterval) {
          clearInterval(alarmInterval);
          alarmInterval = null;
        }
      }
    }

    function formatRow(left, right) {
      const maxLeft = LINE_WIDTH - right.length - 1;
      let trimmedLeft = left;
      if (trimmedLeft.length > maxLeft) trimmedLeft = trimmedLeft.substring(0, maxLeft);
      const spaces = Math.max(1, LINE_WIDTH - (trimmedLeft.length + right.length));
      return trimmedLeft + " ".repeat(spaces) + right;
    }

    function centerRow(text) {
      if (text.length >= LINE_WIDTH) return text;
      const pad = Math.floor((LINE_WIDTH - text.length) / 2);
      return " ".repeat(pad) + text;
    }

    function printSlip(order) {
      const sep = "=".repeat(LINE_WIDTH);
      const dash = "-".repeat(LINE_WIDTH);

      let ticket = [
        sep,
        centerRow("WOKS WAGON"),
        centerRow("*** " + order.type + " ***"),
        sep,
        formatRow("#" + order.id, order.time),
        "Cust: " + order.customer.substring(0, 16)
      ];

      if (order.phone) ticket.push("Tel:  " + order.phone.substring(0, 16));

      if (order.type === "DELIVERY" && order.address) {
        ticket.push(dash);
        ticket.push("DELIVER TO:");
        ticket.push(order.address.substring(0, LINE_WIDTH));
        if (order.address.length > LINE_WIDTH) {
          ticket.push(order.address.substring(LINE_WIDTH, LINE_WIDTH * 2));
        }
      }

      if (order.notes) {
        ticket.push(dash);
        ticket.push("NOTE: " + order.notes.substring(0, 18));
      }

      ticket.push(dash);

      order.items.forEach(i => {
        ticket.push(formatRow(i.qty + "x " + i.name, Number(i.price).toFixed(2)));
      });

      ticket.push(dash);
      ticket.push(formatRow("TOTAL:", "GBP " + Number(order.total).toFixed(2)));
      ticket.push(sep);
      ticket.push("");
      ticket.push("");
      ticket.push("");

      const payload = ticket.join("\n");
      const base64Data = btoa(unescape(encodeURIComponent(payload)));
      window.location.href = "rawbt:data:text/plain;base64," + base64Data;
    }

    function accept(id) {
      const o = orders.find(x => x.id === id);
      if (o) {
        o.status = "ACCEPTED";
        saveOrders();
        draw();
        checkAlarms();
        printSlip(o);
      }
    }

    function reject(id) {
      orders = orders.filter(x => x.id !== id);
      saveOrders();
      draw();
      checkAlarms();
    }

    function complete(id) {
      orders = orders.filter(x => x.id !== id);
      saveOrders();
      draw();
      checkAlarms();
    }

    function clearAll() {
      orders = [];
      saveOrders();
      draw();
      checkAlarms();
    }

    function draw() {
      const g = document.getElementById("grid");
      if (!g) return;
      g.innerHTML = "";

      if (orders.length === 0) {
        g.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:40px; color:#64748b;">No active orders on screen.</div>`;
        return;
      }

      orders.forEach(o => {
        const isPen = o.status === "PENDING";
        const isDel = o.type === "DELIVERY";

        const div = document.createElement("div");
        div.className = "card " + (isPen ? "pending" : "accepted");

        const itemsHtml = o.items.map(i => `
          <div class="item-line">
            <span>${i.qty}x ${i.name}</span>
            <span>£${Number(i.price * i.qty).toFixed(2)}</span>
          </div>
        `).join("");

        div.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
              <strong style="font-size:18px;">#${o.id}</strong>
              <span class="badge ${isDel ? 'badge-del' : 'badge-col'}">${o.type}</span>
              <span class="badge ${isPen ? 'badge-pen' : 'badge-cook'}">${isPen ? 'Pending' : 'Cooking'}</span>
            </div>
            <span style="font-size:12px; color:#94a3b8;">${o.time}</span>
          </div>

          <div style="font-size:14px;"><strong>${o.customer}</strong> ${o.phone ? '• ' + o.phone : ''}</div>

          ${isDel ? `<div class="addr-box">📍 <strong>Address:</strong><br>${o.address}</div>` : `<div class="addr-box" style="border-left:3px solid #d97706;">📦 Collection from counter</div>`}

          ${o.notes ? `<div style="font-size:12px; color:#fbbf24;">📝 Note: ${o.notes}</div>` : ''}

          <div class="items-box">${itemsHtml}</div>

          <div style="display:flex; justify-content:space-between; font-weight:800; font-size:16px;">
            <span>Total:</span>
            <span style="color:#4ade80;">£${Number(o.total).toFixed(2)}</span>
          </div>

          <div class="action-row">
            ${isPen ? `
              <button class="btn-acc" onclick="accept('${o.id}')">✓ Accept & Print</button>
              <button class="btn-rej" onclick="reject('${o.id}')">✕ Reject</button>
            ` : `
              <button class="btn-prt" onclick="printSlip(orders.find(x => x.id === '${o.id}'))">🖨 Reprint</button>
              <button class="btn-don" onclick="complete('${o.id}')">Done</button>
            `}
          </div>
        `;
        g.appendChild(div);
      });
    }

    function addMockOrder(type) {
      enableAudio();
      const id = Math.floor(102 + Math.random() * 800).toString();
      const now = new Date();
      const timeStr = `${now.getHours() % 12 || 12}:${String(now.getMinutes()).padStart(2, '0')} ${now.getHours() >= 12 ? 'PM' : 'AM'}`;

      const newOrder = {
        id: id,
        status: "PENDING",
        type: type,
        customer: type === "DELIVERY" ? "Sarah Jenkins" : "David Miller",
        phone: "07987 654321",
        address: type === "DELIVERY" ? "48 Seafront Road, Hayling Island, PO11 9HL" : "STORE PICKUP",
        notes: type === "DELIVERY" ? "Leave on porch" : "",
        time: timeStr,
        items: [
          { name: "Sweet & Sour Pork", qty: 1, price: 9.20 },
          { name: "Egg Fried Rice", qty: 1, price: 4.50 }
        ],
        total: type === "DELIVERY" ? 16.19 : 14.69
      };

      orders.unshift(newOrder);
      saveOrders();
      draw();
      checkAlarms();
    }

    // Listens for orders saved in other tabs (index.html)
    window.addEventListener("storage", (e) => {
      if (e.key === "activeKitchenOrders" && e.newValue) {
        try {
          orders = JSON.parse(e.newValue);
          draw();
          checkAlarms();
        } catch (err) {}
      }
    });

    // Boot
    loadOrders();
    draw();
    checkAlarms();
  </script>
