<script>
    function printTicket() {
      const ticket = [
        "========================",
        "       WOKS WAGON",
        "     GOTTAEAT ORDER",
        "========================",
        "#101            11:40 AM",
        "Customer: Justin",
        "------------------------",
        "1x Dan Dan Noodles  8.50",
        "1x Chicken Chow Mein 8.95",
        "------------------------",
        "TOTAL:         GBP 17.45",
        "========================",
        "",
        "",
        ""
      ].join("\n");

      // Convert clean text to base64 to avoid URL decode errors
      const base64Data = btoa(unescape(encodeURIComponent(ticket)));
      
      // Standard RawBT base64 call
      window.location.href = "rawbt:data:text/plain;base64," + base64Data;
    }
</script>
